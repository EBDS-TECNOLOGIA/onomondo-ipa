pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "ipa-android"

// Reusable, device-agnostic Android face of the native core: the eUICC
// transport, the JNI bridge, the LPA (EuiccService) declaration, the
// DeviceProfile seam, and libipacore.so itself. Also carries the Phase-1
// transport diagnostic (com.onomondo.ipa.spike).
include ':core'

// The IPAd application layer: foreground service running the native poll cycle,
// live log view, and the settings screen over the shared config.json schema.
// Device-agnostic; builds on :core for the transport, native lib and LPA
// declaration. See ANDROID_PORT_PLAN.md, Phase 5.
include ':ipad'

// Minimal application with no proprietary dependencies, running on stock AOSP
// telephony. Use this to run the IPAd (and the spike diagnostic) on any device
// as a baseline. A device that needs vendor-specific setup adds an application
// module of its own here, implementing DeviceProfileProvider (see :core), and
// keeps every proprietary artifact inside that module.
include ':app-generic'
